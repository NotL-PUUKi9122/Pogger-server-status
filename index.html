<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pogger Server Status</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f7fb;background:#090b12}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#2b164d 0,#111322 38%,#090b12 75%);display:grid;place-items:center;padding:24px}
.card{width:min(760px,100%);background:rgba(20,22,34,.82);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:28px;box-shadow:0 24px 80px #0008;backdrop-filter:blur(16px)}
h1{margin:0 0 6px;font-size:clamp(28px,6vw,44px)}.sub{color:#aeb3c7;margin:0 0 26px}
.status{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;font-size:22px;font-weight:700}.status-main{display:flex;align-items:center;gap:12px;min-width:0}.refresh-inline{grid-column:2;color:#aeb3c7;font-size:16px;font-weight:650;text-align:center}.ping-inline{grid-column:3;justify-self:end;font-size:16px;color:#aeb3c7;font-weight:650;white-space:nowrap}.dot{width:14px;height:14px;flex:none;border-radius:50%;background:#777;box-shadow:0 0 18px #777}
.online .dot{background:#42e58a;box-shadow:0 0 18px #42e58a}.offline .dot{background:#ff5b6e;box-shadow:0 0 18px #ff5b6e}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.box{padding:20px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)}.num{font-size:34px;font-weight:800}.version-num{font-size:34px;overflow-wrap:anywhere}.label{color:#9ea5bd;margin-top:4px}
h2{font-size:20px;margin:28px 0 12px}.players{display:flex;flex-wrap:wrap;gap:10px;min-height:44px}.player{display:inline-flex;align-items:center;gap:9px;padding:8px 12px;border-radius:12px;background:#8d4dff22;border:1px solid #9a65ff55;font-weight:650}.player-head{width:32px;height:32px;flex:none;image-rendering:pixelated;border-radius:4px}
.player-tabs{display:flex;gap:8px;margin:0 0 12px}.player-tab{margin:0;padding:9px 13px;background:#ffffff0d;border:1px solid #ffffff16;color:#aeb3c7}.player-tab[aria-selected="true"]{background:#8d4dff;color:white;border-color:#9a65ff}.player-detail{display:flex;flex-direction:column;gap:3px}.player-detail small{font-size:12px;color:#aeb3c7;font-weight:500}
.empty{color:#9299ae;padding:12px 0}.meta{color:#7f869b;font-size:13px;margin-top:24px}.credits{color:#7f869b;font-size:12px;margin-top:7px}.credits a{color:#aeb3c7}
button{display:block;margin:18px auto 0;background:#8d4dff;color:white;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
@media(max-width:520px){.stats{grid-template-columns:1fr}.card{padding:22px}.status{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;font-size:16px}.status-main{gap:7px}.dot{width:11px;height:11px}.refresh-inline,.ping-inline{font-size:12px}}
</style>
</head>
<body>
<main class="card" id="app">
  <h1>🟣 Pogger Server</h1>
  <p class="sub">Minecraft Java · GPORTAL</p>
  <div id="status" class="status"><span class="dot"></span><span>Checking server…</span></div>
  <section class="stats">
    <div class="box"><div id="count" class="num">—</div><div class="label">Players online</div></div>
    <div class="box"><div id="version" class="num version-num">Checking…</div><div class="label">Minecraft version</div></div>
  </section>
  <button id="refreshButton" onclick="refresh()">Refresh now</button>
  <h2>Players</h2>
  <div class="player-tabs" role="tablist" aria-label="Player status">
    <button id="onlineTab" class="player-tab" role="tab" aria-selected="true" aria-controls="players" onclick="showPlayerTab('online')">Online <span id="onlineTabCount">0</span></button>
    <button id="offlineTab" class="player-tab" role="tab" aria-selected="false" aria-controls="offlinePlayers" onclick="showPlayerTab('offline')">Offline <span id="offlineTabCount">0</span></button>
  </div>
  <div id="players" class="players"><span class="empty">Loading player list…</span></div>
  <div id="offlinePlayers" class="players" hidden></div>
  <div class="meta">Player history is saved in this browser and records names only while this page is open.</div>
  <div id="updated" class="meta"></div>
  <div class="credits">Ping data provided by <a href="https://www.minecraftpinger.com" target="_blank" rel="noopener">MinecraftPinger</a>.</div>
</main>
<script>
const SERVER = "167.86.104.112:25985";
const ENDPOINT = `https://api.mcstatus.io/v2/status/java/${SERVER}`;
const PING_ENDPOINT = `https://www.minecraftpinger.com/api/v1/${SERVER}`;
const HISTORY_KEY = "pogger-status-player-history-v1";
const LEGACY_HISTORY_KEY = "cobblemon-status-player-history-v1";
let lastResult = null;
let refreshInFlight = false;
let pingInFlight = false;
let lastPing = null;
let lastRequestFailed = false;
let serverUnavailable = false;

function renderStatus(){
  const status=document.getElementById("status");
  const online=lastResult?.online;
  const state=lastResult?(online?"ONLINE":"OFFLINE"):serverUnavailable?"UNREACHABLE":"Checking server…";
  const details=[];
  if(refreshInFlight&&lastResult) details.push("Refreshing");
  if(lastRequestFailed&&lastResult) details.push("showing last result");
  status.className=lastResult?`status ${online?"online":"offline"}`:serverUnavailable?"status offline":"status";
  status.innerHTML=`<span class="status-main"><span class="dot"></span><span>${state}</span></span>${details.length?`<span class="refresh-inline">${details.join(" · ")}</span>`:'<span></span>'}${Number.isFinite(lastPing)?`<span class="ping-inline">ping ${lastPing} ms</span>`:'<span class="ping-inline"></span>'}`;
}

async function refresh(){
  if(refreshInFlight) return;
  refreshInFlight=true;
  const players=document.getElementById("players");
  const button=document.getElementById("refreshButton");
  button.disabled=true;
  button.textContent="Refreshing…";
  refreshPing();
  renderStatus();
  if(!lastResult){
    players.innerHTML='<span class="empty">Loading player list…</span>';
  }
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),10000);
    let r;
    try{r=await fetch(ENDPOINT,{cache:"no-store",signal:controller.signal});}
    finally{clearTimeout(timeout);}
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(typeof d.online!=="boolean") throw new Error("Invalid status response");
    const online=!!d.online;
    const reportedVersion=typeof d.version==="string"?d.version:(d.version?.name_clean??d.version?.name_raw);
    const cleanVersion=typeof reportedVersion==="string"?reportedVersion.replace(/§[0-9A-FK-OR]/gi,"").trim():"";
    document.getElementById("version").textContent=cleanVersion||(online?"Unknown":"Offline");
    const sourceCheckedAt=Number.isFinite(d.retrieved_at)?new Date(d.retrieved_at):new Date();
    lastResult={online,data:d,checkedAt:new Date(),sourceCheckedAt};
    lastRequestFailed=false;
    serverUnavailable=false;
    document.getElementById("app").classList.toggle("online",online);
    document.getElementById("app").classList.toggle("offline",!online);
    renderStatus();
    const p=d.players||{};
    document.getElementById("count").textContent=online?`${p.online ?? 0}${p.max!=null?"/"+p.max:""}`:"0";
    const names=Array.isArray(p.list)?p.list:[];
    const playerEntries=names.map(player=>({
      name:typeof player==="string"?player:(player?.name_clean??player?.name_raw??player?.name),
      uuid:typeof player==="object"?player?.uuid:null
    })).filter(player=>typeof player.name==="string"&&player.name.length>0);
    const history=updatePlayerHistory(playerEntries,online,p.online,sourceCheckedAt);
    document.getElementById("onlineTabCount").textContent=p.online??playerEntries.length;
    renderOfflinePlayers(history);
    players.innerHTML=playerEntries.length
      ? playerEntries.map(({name,uuid})=>`<span class="player">${playerAvatarMarkup(name,uuid)}<span>${escapeHtml(name)}</span></span>`).join("")
      : `<span class="empty">${online&&p.online>0?"Players are online, but the status service did not return their names.":"Nobody is online."}</span>`;
    document.getElementById("updated").textContent="Server data checked: "+lastResult.sourceCheckedAt.toLocaleTimeString()+" · provider may cache for up to 1 minute";
  }catch(e){
    if(lastResult){
      lastRequestFailed=true;
      renderStatus();
      const age=Math.max(1,Math.floor((Date.now()-lastResult.checkedAt.getTime())/60000));
      document.getElementById("updated").textContent=`Refresh failed; last successful check ${age} minute${age===1?"":"s"} ago.`;
    }else{
      serverUnavailable=true;
      renderStatus();
      document.getElementById("app").classList.remove("online");
      document.getElementById("app").classList.add("offline");
      document.getElementById("count").textContent="—";
      players.innerHTML='<span class="empty">Could not retrieve live server data.</span>';
      document.getElementById("updated").textContent="Last check failed: "+new Date().toLocaleTimeString();
    }
  }finally{
    refreshInFlight=false;
    button.disabled=false;
    button.textContent="Refresh now";
    renderStatus();
  }
}
async function refreshPing(){
  if(pingInFlight) return;
  pingInFlight=true;
  try{
    const r=await fetch(PING_ENDPOINT,{cache:"no-store",headers:{"User-Agent":"PoggerServerStatus/1.0"}});
    if(!r.ok) return;
    const d=await r.json();
    if(d.message!=="ok") return;
    lastPing=d.server&&Number.isFinite(d.server.ping)?Math.round(d.server.ping):null;
    renderStatus();
  }catch(e){
    // Keep the last ping if this secondary lookup fails.
  }finally{
    pingInFlight=false;
  }
}
function playerKey(player){
  return typeof player.uuid==="string"&&/^[0-9a-f-]{32,36}$/i.test(player.uuid)
    ? player.uuid.toLowerCase()
    : player.name.toLowerCase();
}
function loadPlayerHistory(){
  try{
    const saved=localStorage.getItem(HISTORY_KEY);
    const legacy=saved===null?localStorage.getItem(LEGACY_HISTORY_KEY):null;
    const data=JSON.parse(saved??legacy??"[]");
    if(saved===null&&legacy!==null){
      localStorage.setItem(HISTORY_KEY,JSON.stringify(data));
      localStorage.removeItem(LEGACY_HISTORY_KEY);
    }
    return Array.isArray(data)?data.filter(player=>player&&typeof player.name==="string"&&typeof player.lastSeen==="string").slice(-200):[];
  }catch(e){return [];}
}
function updatePlayerHistory(players,serverOnline,playerCount,observedAt){
  const history=loadPlayerHistory();
  const observedKeys=new Set();
  for(const player of players){
    const key=playerKey(player);
    observedKeys.add(key);
    let entry=history.find(item=>item.key===key);
    if(!entry){entry={key,name:player.name,uuid:player.uuid||null,lastSeen:observedAt.toISOString(),online:true};history.push(entry);}
    else{entry.name=player.name;entry.uuid=player.uuid||entry.uuid||null;entry.lastSeen=observedAt.toISOString();entry.online=true;}
  }
  if(players.length){
    for(const entry of history) entry.online=observedKeys.has(entry.key);
  }else if(!serverOnline||playerCount===0){
    for(const entry of history) entry.online=false;
  }
  const boundedHistory=history.slice(-200);
  try{localStorage.setItem(HISTORY_KEY,JSON.stringify(boundedHistory));}catch(e){}
  return boundedHistory;
}
function playerAvatarMarkup(name,uuid){
  const imageId=typeof uuid==="string"&&/^[0-9a-f-]{32,36}$/i.test(uuid)?uuid:name;
  if(!/^[A-Za-z0-9_-]{1,36}$/.test(imageId)) return "";
  const url=`https://skinrender.dev/render/${encodeURIComponent(imageId)}/face?size=32`;
  return `<img class="player-head" src="${url}" alt="" width="32" height="32" loading="lazy" decoding="async" referrerpolicy="no-referrer" aria-hidden="true" onerror="this.remove()">`;
}
function renderOfflinePlayers(history){
  const offline=history.filter(player=>!player.online).sort((a,b)=>Date.parse(b.lastSeen)-Date.parse(a.lastSeen));
  document.getElementById("offlineTabCount").textContent=offline.length;
  document.getElementById("offlinePlayers").innerHTML=offline.length
    ? offline.map(player=>{
        const lastSeen=new Date(player.lastSeen);
        const dateText=Number.isNaN(lastSeen.getTime())?"Unknown":lastSeen.toLocaleString();
        return `<span class="player">${playerAvatarMarkup(player.name,player.uuid)}<span class="player-detail"><span>${escapeHtml(player.name)}</span><small>Last seen online: ${escapeHtml(dateText)}</small></span></span>`;
      }).join("")
    : '<span class="empty">No offline players have been recorded on this browser yet.</span>';
}
function showPlayerTab(tab){
  const online=tab==="online";
  document.getElementById("players").hidden=!online;
  document.getElementById("offlinePlayers").hidden=online;
  document.getElementById("onlineTab").setAttribute("aria-selected",String(online));
  document.getElementById("offlineTab").setAttribute("aria-selected",String(!online));
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
refresh();
setInterval(refresh,15000);
</script>
</body>
</html>
